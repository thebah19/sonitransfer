<VirtualHost *:80>
    ServerName stagging.sonitransfer.com

    ProxyPreserveHost On
    ProxyRequests Off

    Alias /.well-known/acme-challenge/ "/var/www/letsencrypt/.well-known/acme-challenge/"
    <Directory "/var/www/letsencrypt/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/stagging-sonitransfer.com-error.log
    CustomLog ${APACHE_LOG_DIR}/stagging-sonitransfer.com-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName stagging.sonitransfer.com

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    RedirectMatch 307 ^/v2$ /v2/en
    ProxyPass /v2/ http://127.0.0.1:3002/v2/ retry=0 timeout=60
    ProxyPassReverse /v2/ http://127.0.0.1:3002/v2/
    ProxyPass / http://127.0.0.1:3001/ retry=0 timeout=60
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/stagging-sonitransfer.com-error.log
    CustomLog ${APACHE_LOG_DIR}/stagging-sonitransfer.com-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/stagging.sonitransfer.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/stagging.sonitransfer.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
