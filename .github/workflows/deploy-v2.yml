name: Deploy V2 review

on:
  push:
    branches: [V2]
  workflow_dispatch:

concurrency:
  group: soni-transfer-v2-review
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: |
          VITE_BASE_PATH=/v2/ npm run build
          npm run test:sites

      - name: Configure staging SSH access
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/soni-staging
          chmod 600 ~/.ssh/soni-staging
          printf '%s\n' "$STAGING_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload and activate static review
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          release_path="deployments/sonitransfer-v2/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/soni-staging "$STAGING_USER@$STAGING_HOST" \
            "mkdir -p ~/$release_path"
          rsync -az --delete \
            -e 'ssh -i ~/.ssh/soni-staging' \
            dist/client/ "$STAGING_USER@$STAGING_HOST:~/$release_path/"
          ssh -i ~/.ssh/soni-staging "$STAGING_USER@$STAGING_HOST" \
            "umask 0002 && rsync -rlD --checksum --no-perms --omit-dir-times --delete ~/$release_path/ /var/www/stagging-soni-transfer-prototype/"

      - name: Verify deployed review
        run: |
          curl --fail --silent --show-error --location \
            https://stagging.sonitransfer.com/v2/ > /dev/null
          curl --fail --silent --show-error \
            https://stagging.sonitransfer.com/v2/assets/soni-logo-crop.png > /dev/null
